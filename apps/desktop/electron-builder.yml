appId: com.agentmate.app
productName: AgentMate
executableName: AgentMate
directories:
  output: release

# node-pty is N-API based and ships working prebuilt binaries for every
# platform we target. electron-builder's default native-rebuild step tries
# to compile it from source instead, which fails because the npm-published
# tarball is missing the winpty git submodule's build scripts. Skip it.
npmRebuild: false

files:
  - out/**/*
  - package.json
  - resources/icon.ico

extraResources:
  - from: resources/example-skill-repo
    to: example-skill-repo

# node-pty ships native .node/.dll/.exe files that must exist as real files on
# disk (it also spawns conpty/winpty helper executables at runtime); they
# can't be loaded from inside the asar archive.
#
# onnxruntime-node (pulled in by @huggingface/transformers for local Whisper
# speech-to-text) is the same story: it dlopen's prebuilt .node/.dll/.so files
# that have to live on the real filesystem, not inside the archive.
#
# The usage scan worker is started via `new Worker(<path>)`; the module loader
# inside a worker thread reads off the real filesystem rather than through
# Electron's asar shim, so the worker entry AND the chunk it shares with the
# main bundle both have to exist unpacked.
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/onnxruntime-node/**'
  - 'out/main/usageScanWorker.mjs'
  - 'out/main/codeqlExtractWorker.mjs'
  - 'out/main/chunks/**'

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Default artifactName has spaces ("AgentMate Setup 1.1.0.exe"). GitHub
  # renames uploaded assets with spaces to dots on download, but the
  # latest.yml electron-builder writes for electron-updater sanitizes spaces
  # to dashes instead - the two disagree and auto-update downloads 404. Keep
  # this dash-only, matching the other platforms' artifact names.
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  icon: build/icon.png
  # Required for Prompt Builder's voice input: macOS crashes the app on mic
  # access unless this usage string is present in Info.plist.
  extendInfo:
    NSMicrophoneUsageDescription: AgentMate uses the microphone to transcribe your voice into the Prompt Builder.
  target:
    - target: dmg
      arch: [x64, arm64]
    # electron-updater's macOS auto-update path (Squirrel.Mac) downloads the
    # zip, not the dmg; the dmg is only for first-time manual installs.
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development

# The deb target's default artifact name embeds the raw package.json "name"
# ("@agentmat/desktop"), which contains a slash and would build to a nested
# path (release/@agentmat/desktop_1.0.0_amd64.deb) that the CD workflow's
# `apps/desktop/release/*.deb` upload glob can't see. Use productName instead.
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}

# electron-updater reads this to know where to look for new releases. The CD
# workflow builds with `--publish never` and uploads artifacts to the GitHub
# Release itself (see .github/workflows/cd.yml), so this only needs to name
# the repo; electron-updater talks to the GitHub Releases API directly.
publish:
  provider: github
  owner: Cyrus-Sushiant
  repo: AgentMate
  releaseType: release
