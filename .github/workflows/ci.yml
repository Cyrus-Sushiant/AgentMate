name: CI

# Checks every push and pull request: formatting/lint (Biome), no deprecated
# dependencies or deprecated imports, types, a real build of the desktop app,
# and the test suites (unit, integration and mobile always, end-to-end only when
# tagged with [e2e]; see the tests job below).
# Cross-platform packaging is left to the CD workflow, which runs on the
# actual Windows/macOS/Linux runners when a release tag is pushed.

on:
  push:
    branches:
      - master
  pull_request:
    # `edited` so adding [e2e] to the title of an open pull request starts the E2E matrix.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the Electron end-to-end matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # --frozen-lockfile also fails the build when package.json and
      # pnpm-lock.yaml have drifted apart.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `biome ci` = formatter + linter + import sorting in one pass, without
      # writing anything. --reporter=github turns findings into inline
      # annotations on the pull request.
      - name: Biome (format, lint, import order)
        if: ${{ !cancelled() }}
        run: pnpm biome:ci --reporter=github

      # Anything we import that upstream has marked @deprecated. This is the
      # lint/suspicious/noDeprecatedImports rule on its own, so a failure here
      # says "deprecated API" rather than "some lint rule".
      - name: No deprecated code
        if: ${{ !cancelled() }}
        run: pnpm check:deprecated-code --reporter=github

      # Direct dependencies the npm registry reports as deprecated. Known
      # exceptions live in .github/deprecated-deps-allowlist.json.
      - name: No deprecated dependencies
        if: ${{ !cancelled() }}
        run: pnpm check:deprecated-deps

      # Desktop and mobile type-check against @agentmat/core and
      # @agentmat/protocol declaration output, so those have to be built first.
      - name: Build workspace packages
        if: ${{ !cancelled() }}
        run: pnpm --filter @agentmat/core --filter @agentmat/protocol build

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm -r typecheck

      # better-sqlite3 and node-pty stay external in the bundle, so this needs
      # no native rebuild. Packaging installers is CD's job.
      - name: Build desktop app
        if: ${{ !cancelled() }}
        run: pnpm --filter @agentmat/desktop build

  # The E2E matrix is slow (three OSes), so it only runs when asked for with the [e2e] tag: in a
  # commit message of the push, or in the pull request title. A manual run can tick the e2e box
  # instead. Unit tests always run.
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      e2e: ${{ (github.event_name == 'push' && contains(join(github.event.commits.*.message, ' '), '[e2e]')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[e2e]')) || (github.event_name == 'workflow_dispatch' && inputs.e2e) }}

  # One status to require in branch protection: the matrix job names change whenever the OS list
  # does, and a skipped job would otherwise count as success.
  all-green:
    name: All checks passed
    if: ${{ always() }}
    needs: [check, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
